<template>
  <lightning-button label="New Receipt" onclick={openModal}></lightning-button>

  <template if:true={isModalOpen}>
    <section class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 class="slds-text-heading_medium">New Receipt</h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
          <lightning-record-edit-form
            object-api-name="Receipt__c"
            onsuccess={handleSuccess}
            onsubmit={handleSubmit}
          >
            <lightning-input-field
              field-name="Amount__c"
            ></lightning-input-field>

            <lightning-input-field
              field-name="Mode_Of_Pay__c"
              value={defaultValues.modeOfPay}
            ></lightning-input-field>

            <lightning-input-field
              field-name="Amount_Paid_Date__c"
              value={defaultValues.paymentDate}
            ></lightning-input-field>

            <br />

            <lightning-button
              label="Cancel"
              onclick={closeModal}
            ></lightning-button>

            <lightning-button
              type="submit"
              variant="brand"
              label="Submit"
              disabled={isLoading}
              class="slds-p-left_small"
            >
            </lightning-button>
          </lightning-record-edit-form>
        </div>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

    <template if:true={isLoading}>
      <lightning-spinner alternative-text="Saving"></lightning-spinner>
    </template>
  </template>
</template>
