<template>
  <lightning-card icon-name="standard:account" variant="base">
    <div slot="title">CS - 6 - Account Search</div>
    <div slot="actions"></div>

    <div>
      <div class="slds-grid slds-gutter_small">
        <lightning-input
          type="text"
          placeholder="Search Account Name"
          value={searchValue}
          onchange={handleSearchChange}
          variant="label-hidden"
          class="slds-m-bottom_small slds-col"
        ></lightning-input>
        <lightning-button
          class="slds-p-horizontal_small"
          variant="brand"
          label="Search"
          onclick={handleClick}
        ></lightning-button>
      </div>

      <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..."></lightning-spinner>
      </template>

      <template if:true={accounts}>
        <lightning-datatable key-field="Id" data={accounts} columns={columns}>
        </lightning-datatable>
      </template>
    </div>
  </lightning-card>
</template>
