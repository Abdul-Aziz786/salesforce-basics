<template>
  <lightning-card title="Account Search" icon-name="standard:account">
    <div class="slds-p-around_medium">
      <lightning-input
        label="Search Account"
        value={searchKey}
        onchange={handleChange}
      >
      </lightning-input>

      <template if:true={accounts.length}>
        <br />
        <div style="height: 300px">
          <lightning-datatable
            key-field="Id"
            data={accounts}
            columns={columns}
            enable-infinite-loading
            onloadmore={loadMoreData}
            is-loading={isLoading}
          >
          </lightning-datatable>
        </div>
      </template>

      <template if:true={isLoading}>
        <div class="slds-align_absolute-center slds-m-top_small">
          <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </div>
      </template>

      <template if:true={hasSearched}>
        <template if:false={accounts.length}>
          <p class="slds-text-color_weak slds-m-top_small">No records found</p>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
