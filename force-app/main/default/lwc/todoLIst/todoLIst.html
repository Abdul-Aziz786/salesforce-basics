<template>
    <lightning-card variant="base">
        <div slot="title">
            TODO List 
        </div>

        <div>
            <lightning-layout vertical-align="center" horizontal-align="space">



                <lightning-layout-item flexibility="auto" size="10" padding="around-small">

                    <lightning-input type="text" placeholder="Enter a value" variant="label-hidden"></lightning-input>

                </lightning-layout-item>

                <lightning-layout-item flexibility="auto" size="2" padding="around-small">
                    <lightning-button variant="brand" label="+" onclick={handleAddTodo}></lightning-button>

                </lightning-layout-item>

            </lightning-layout>
            <template for:each={todos} for:item="todo">
                <lightning-layout key={todo.id} horizontal-align="center" pull-to-boundary="small"
                    vertical-align="start">
                    <lightning-layout-item flexibility="auto" size="10" padding="around-small">
                        <p class="slds-text-body_regular">{todo.text}</p>
                    </lightning-layout-item>
                    <lightning-layout-item>
                        <lightning-button variant="destructive" label="Delete" onclick={handleDeleteTodo}
                            data-id={todo.id}></lightning-button>
                    </lightning-layout-item>

                </lightning-layout>
            </template>
        </div>

        <template for:each={data} for:item="item">
            <lightning-layout key={item.Email} class="slds-m-around_medium">
                <lightning-layout-item class="slds-m-right_medium">
                    <img src={item.Photo} alt="Photo" class="slds-avatar slds-avatar_circle" />
                </lightning-layout-item>
                <lightning-layout-item>
                    <p>{item.Name}</p>
                    <p>{item.Email}</p>
                </lightning-layout-item>

            </lightning-layout>
        </template>

        <lightning-button variant="base" label="Fetch" onclick={fetchData}></lightning-button>

        <template if:true={loader}>
            <lightning-spinner></lightning-spinner>
        </template>
        <template if:true={hasData}>
            <lightning-layout class="slds-m-around_medium">
                <lightning-layout-item class="slds-m-right_medium">
                    <img src={currentItem.Photo} alt="Photo" class="slds-avatar slds-avatar_circle" />
                </lightning-layout-item>
                <lightning-layout-item>
                    <p>{currentItem.Name}</p>
                    <p>{currentItem.Email}</p>
                </lightning-layout-item>

            </lightning-layout>
            <div class="slds-m-top_medium">

                <lightning-button label="Previous" onclick={previous}>
                </lightning-button>

                <lightning-button label="Next" onclick={next}>
                </lightning-button>

            </div>
        </template>

    </lightning-card>

</template>
