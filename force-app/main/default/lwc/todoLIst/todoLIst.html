<template>
  <lightning-card variant="base">
    <div slot="title">TODO List</div>

    <div>
      <lightning-layout vertical-align="center" horizontal-align="space">
        <lightning-layout-item
          flexibility="auto"
          size="10"
          padding="around-small"
        >
          <lightning-input
            type="text"
            placeholder="Enter a value"
            variant="label-hidden"
          ></lightning-input>
        </lightning-layout-item>

        <lightning-layout-item
          flexibility="auto"
          size="2"
          padding="around-small"
        >
          <lightning-button
            variant="brand"
            label="+"
            onclick={handleAddTodo}
          ></lightning-button>
        </lightning-layout-item>
      </lightning-layout>
      <template for:each={todos} for:item="todo">
        <lightning-layout
          key={todo.id}
          horizontal-align="center"
          pull-to-boundary="small"
          vertical-align="start"
        >
          <lightning-layout-item
            flexibility="auto"
            size="10"
            padding="around-small"
          >
            <p class="slds-text-body_regular">{todo.text}</p>
          </lightning-layout-item>
          <lightning-layout-item>
            <lightning-button
              variant="destructive"
              label="Delete"
              onclick={handleDeleteTodo}
              data-id={todo.id}
            ></lightning-button>
          </lightning-layout-item>
        </lightning-layout>
      </template>
    </div>
  </lightning-card>
</template>
