<template>
  <lightning-modal-header label="New Complaint"></lightning-modal-header>

  <lightning-modal-body>
    <lightning-combobox
      label="Complaint Type"
      value={complaintType}
      options={typeOptions}
      onchange={handleType}
      required
    >
    </lightning-combobox>
    <lightning-textarea
      label="Comments"
      value={comments}
      onchange={handleComments}
      required
    >
    </lightning-textarea>
    <lightning-textarea
      label="Resolution"
      value={resolution}
      onchange={handleResolution}
    >
    </lightning-textarea>
  </lightning-modal-body>

  <lightning-modal-footer>
    <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>

    <lightning-button
      class="slds-p-left_small"
      label="Save"
      variant="brand"
      disabled={isLoading}
      onclick={handleSave}
    >
    </lightning-button>
  </lightning-modal-footer>
</template>
