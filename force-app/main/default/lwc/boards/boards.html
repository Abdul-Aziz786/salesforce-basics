<template>
  <lightning-card title="Board">
    <lightning-button-icon
      icon-name="utility:add"
      alternative-text="Add Board"
      variant="border-filled"
      onclick={handleAddBoard}
      slot="actions"
    ></lightning-button-icon>
    <div>
      <lightning-datatable
        key-field="id"
        checkbox-column="false"
        data={boards}
        columns={columns}
        onrowaction={rowAction}
      ></lightning-datatable>
    </div>
  </lightning-card>

  <template lwc:if={isModalOpen}>
    <section class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 class="slds-text-heading_medium">New Board</h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
          <lightning-record-edit-form
            object-api-name={objectApiName}
            onsubmit={handleSubmit}
          >
            <lightning-input-field
              field-name={nameField}
            ></lightning-input-field>
            <lightning-input-field
              field-name={descriptionField}
            ></lightning-input-field>
            <lightning-input-field
              field-name={noOfSectionsField}
              onchange={handleSectionChange}
              class="slds-m-bottom_small"
            ></lightning-input-field>
            <template for:each={sections} for:item="section">
              <lightning-input
                key={section.id}
                label={section.label}
                required
                data-section-control="true"
                class="slds-m-bottom_small"
              ></lightning-input>
            </template>
            <lightning-button
              label="Cancel"
              onclick={handleCloseModal}
            ></lightning-button>

            <lightning-button
              type="submit"
              variant="brand"
              label="Add Board"
              disabled={isLoading}
              class="slds-p-left_small"
            >
            </lightning-button>
          </lightning-record-edit-form>
        </div>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

    <template if:true={isLoading}>
      <lightning-spinner alternative-text="Saving"></lightning-spinner>
    </template>
  </template>
</template>
